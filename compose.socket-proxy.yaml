# Optional hardening (ADR-0011): put a filtering proxy between Lookout and the Docker socket,
# so Lookout can reach only the Engine API endpoints it uses. Use it with compose.yaml:
#
#   docker compose -f compose.yaml -f compose.socket-proxy.yaml up -d
#
# Lookout itself then has no access to /var/run/docker.sock. Through the proxy it can list,
# inspect and watch Containers, read their logs and stats, and start, stop, restart and
# remove them, and nothing else: no exec, no create (so no host mounts), no pull, no
# images, volumes, networks, secrets or swarm. Needs Docker Compose 2.24 or later.
#
# The proxy listens on a Unix socket in a volume only it and Lookout mount (#101), never on
# a TCP port: on the Host's loopback any local user or host-network Container could use it,
# with no password and no docker group.
services:
  docker-proxy:
    # wollomatic/socket-proxy (MIT): a small Go proxy that allows requests by method and
    # path. Pinned by digest; Dependabot keeps it current.
    image: wollomatic/socket-proxy:1.14.0@sha256:fead157c4de4092461267092be49c993c2e6dd296a54c89ed04b8c870016b045
    container_name: lookout-docker-proxy
    restart: unless-stopped
    # No network at all: Lookout reaches it through the socket in docker-proxy-socket.
    network_mode: none
    # A user no Host account uses, in Lookout's group (65532), so only Lookout may connect.
    user: '65533:65532'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    labels:
      # Lookout refuses to stop, restart or remove the proxy, which would cut it off Docker.
      lookout.self: 'true'
    # The proxy runs as an unprivileged user; this group lets it reach the Docker socket.
    group_add:
      - ${DOCKER_GID:?Set DOCKER_GID in .env to the Docker socket's group (stat -c %g /var/run/docker.sock)}
    command:
      - -loglevel=WARN
      # Owner and group (Lookout) may connect; nobody else (0660).
      - -proxysocketendpoint=/run/lookout-docker/docker.sock
      - -proxysocketendpointfilemode=432
      # Restart the proxy if Docker restarts and the socket goes away.
      - -watchdoginterval=60
      - -stoponwatchdog
      # The endpoints in ADR-0005, by method and path. Each pattern must match the whole path;
      # an optional /v1.NN API version prefix is allowed. The proxy never sees the query, so
      # it cannot refuse remove's force=true or v=true: only Lookout's code sends
      # force=false&v=false. ADR-0011 accepts that, with its end date (#102).
      - -allowGET=(/v1\.[0-9]+)?/(_ping|events|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs|stats)|images/[^/]+/json)
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart)
      - -allowDELETE=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-proxy-socket:/run/lookout-docker

  lookout:
    depends_on:
      - docker-proxy
    # No Docker group and no socket: the proxy is Lookout's only way to Docker.
    group_add: !reset []
    environment:
      DOCKER_HOST: unix:///run/lookout-docker/docker.sock
    # The Host's root filesystem, read-only (ADR-0003), the proxy's socket (not Docker's) and
    # Lookout's data volume, for a password changed in Settings.
    volumes: !override
      - /:/host:ro,rslave
      - lookout-data:/data
      - docker-proxy-socket:/run/lookout-docker

volumes:
  # The proxy's socket lives here, in memory. Only root and group 65532 (Lookout and the
  # proxy) may enter it, so no other Host user reaches the socket (#101).
  docker-proxy-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=0,gid=65532,mode=0770,size=64k
