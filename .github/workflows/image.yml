# Builds the multi-arch Image and pushes it to GHCR (PRD §8, ADR-0003). Called by
# release.yml: once for :edge on every merge to main, and once more for a versioned
# release. The Host only ever pulls these; nothing is compiled on it.
name: Image

on:
  workflow_call:
    inputs:
      version:
        description: 'The release version (for example 1.0.0), or empty for :edge.'
        type: string
        required: false
        default: ''
      ref:
        description: 'The commit or tag to build.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job in the repo that can write packages, or sign anything (#126).
    permissions:
      contents: read
      packages: write
      # Signs the provenance attestation through Sigstore (OIDC), and stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image name
        id: image
        # GHCR names must be lower case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lookout" >> "$GITHUB_OUTPUT"

      - name: Footer version
        id: footer
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge (${REF:0:7})" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # :edge and :sha-<short> follow main; a release adds :X.Y.Z, :X.Y and :latest.
          tags: |
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha,format=short,prefix=sha-
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Lookout
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.url=https://lookout.adrianeyre.co.uk
          annotations: |
            org.opencontainers.image.revision=${{ inputs.ref }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            LOOKOUT_VERSION=${{ steps.footer.outputs.version }}
          # SLSA provenance and an SPDX SBOM, attached to the Image in the registry.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the Image's provenance
        # A signed SLSA provenance attestation for the pushed digest, stored with the Image, so
        # a Host can check what it pulled came from this repository's workflow (README,
        # "Verifying an Image"; #126). GitHub keeps attestations for a private repository
        # only on Enterprise Cloud, so this starts when the repository is made public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
