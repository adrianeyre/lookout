name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, format, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  site:
    name: Project Website build, accessibility and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:build
      # axe WCAG 2.2 AA in light and dark, no sideways scroll at 360px, no third-party
      # requests, cookies or storage, and readable without JavaScript.
      - run: pnpm site:check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag lookout:ci .
      - name: The Image holds no tests and no fake Docker
        run: |
          docker run --rm --entrypoint sh lookout:ci -c '
            set -e
            test ! -e apps/server/test-support
            test ! -e apps/server/test
            # The server runs compiled: no TypeScript, so no tests, in the Image at all.
            test -z "$(find apps -name "*.ts")"
            test ! -e /usr/local/bin/npm
            test "$(id -u)" != 0
          '
      - name: The Image refuses to start with an invalid port
        run: |
          output=$(docker run --rm -e LOOKOUT_PORT=99999 lookout:ci 2>&1) && exit 1
          echo "$output"
          echo "$output" | grep -q 'LOOKOUT_PORT must be a whole number'
      - name: The Image starts as non-root and reports itself healthy
        run: |
          docker run -d --name lookout-ci --group-add 0 \
            -e LOOKOUT_PASSWORD_HASH="$(printf 'ci-password\n' | docker run --rm -i lookout:ci hash-password 2>/dev/null)" \
            -e LOOKOUT_SESSION_SECRET="$(openssl rand -base64 32)" \
            -v /var/run/docker.sock:/var/run/docker.sock -v /:/host:ro \
            lookout:ci
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lookout-ci)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs lookout-ci
          test "$status" = healthy
          docker rm -f lookout-ci
      # Vulnerability scan of the Image (v1 security review). Fails on any fixable HIGH or
      # CRITICAL finding; the full table is in the log.
      - name: Scan the Image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --quiet --scanners vuln --ignore-unfixed --exit-code 1 \
            --severity HIGH,CRITICAL lookout:ci
